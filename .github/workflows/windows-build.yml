name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build CLI (release)
        run: cargo build --release -p lightcraft-cli

      - name: Build desktop app (release)
        run: cargo build --release -p lightcraft

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/lightcraft.exe dist/
          Copy-Item target/release/lightcraft-cli.exe dist/
          if (Test-Path assets) { Copy-Item -Recurse assets dist/ }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: lightcraft-windows-x64
          path: dist/
          retention-days: 30
